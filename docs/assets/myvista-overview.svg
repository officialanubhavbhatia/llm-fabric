<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" role="img" aria-labelledby="title desc">
  <title id="title">MyVista LLM Fabric architecture</title>
  <desc id="desc">Client SDK to MyVista auth, tenant, guardrails, required IntentOS, required context compiler, and route planner, then Ollama, LiteLLM transport, or direct vLLM.</desc>
  <rect width="980" height="420" fill="#0f1419"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6ea8fe"/>
    </marker>
  </defs>
  
  <text x="32" y="36" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="600">MyVista LLM Fabric</text>
  <text x="32" y="56" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12">Serving path: Auth → Tenant → Guardrails → IntentOS (required) → Context compiler (required) → Route planner. LiteLLM is transport, not an inference engine.</text>
  <rect x="40" y="80" width="160" height="64" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="52" y="102" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Client / SDK</text>
  <text x="52" y="120" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">Python myvista</text>
  <text x="52" y="135" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">curl / OpenAI-shaped</text>
  <line x1="200" y1="112" x2="248" y2="112" stroke="#6ea8fe" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="250" y="72" width="500" height="80" rx="8" fill="#1a222c" stroke="#6ea8fe"/>
  <text x="262" y="94" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">MyVista control plane</text>
  <text x="262" y="112" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">Auth · Tenant · INPUT guardrails</text>
  <text x="262" y="127" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">IntentOS REQUIRED · Context compiler REQUIRED</text>
  <text x="262" y="142" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">Route planner · OUTPUT guardrails · usage / OTEL</text>
  <line x1="500" y1="152" x2="500" y2="188" stroke="#6ea8fe" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="40" y="190" width="200" height="70" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="52" y="212" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Ollama</text>
  <text x="52" y="230" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">direct runtime</text>
  <rect x="154" y="198" width="74" height="16" rx="8" fill="none" stroke="#7fd99a"/><text x="191" y="210" text-anchor="middle" fill="#7fd99a" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9">runtime</text>
  <rect x="280" y="190" width="220" height="70" rx="8" fill="#1a222c" stroke="#e6b84d"/>
  <text x="292" y="212" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">LiteLLM</text>
  <text x="292" y="230" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">transport only</text>
  <text x="292" y="245" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">not an inference engine</text>
  <rect x="414" y="198" width="74" height="16" rx="8" fill="none" stroke="#e6b84d"/><text x="451" y="210" text-anchor="middle" fill="#e6b84d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9">transport</text>
  <rect x="540" y="190" width="210" height="70" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="552" y="212" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">vLLM direct</text>
  <text x="552" y="230" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">OpenAI-compatible runtime</text>
  <rect x="664" y="198" width="74" height="16" rx="8" fill="none" stroke="#7fd99a"/><text x="701" y="210" text-anchor="middle" fill="#7fd99a" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9">runtime</text>
  <line x1="390" y1="260" x2="390" y2="296" stroke="#6ea8fe" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="40" y="298" width="180" height="64" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="52" y="320" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Ollama</text>
  <text x="52" y="338" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">via LiteLLM</text>
  <rect x="240" y="298" width="180" height="64" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="252" y="320" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">vLLM</text>
  <text x="252" y="338" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">via LiteLLM</text>
  <rect x="440" y="298" width="180" height="64" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="452" y="320" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">External</text>
  <text x="452" y="338" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">hosted APIs</text>
  <rect x="700" y="190" width="260" height="172" rx="8" fill="#1a222c" stroke="#6ea8fe"/>
  <text x="712" y="212" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Parallel systems</text>
  <text x="712" y="230" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">Command Center</text>
  <text x="712" y="245" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">Usage ledger</text>
  <text x="712" y="260" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">Evaluations</text>
  <text x="712" y="275" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">OpenTelemetry</text>
  <text x="40" y="390" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">KV / prefix / running / waiting are DEPLOYMENT engine scrapes, never “this request used X% KV”. Retrieval, tools, and agents are not on the serving path.</text>

</svg>
