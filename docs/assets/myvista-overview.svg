<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
  <title id="title">MyVista LLM Fabric architecture</title>
  <desc id="desc">SDK to gateway to IntentOS classify, route planner, and inference adapters, with parallel guardrails, usage, evals, OpenTelemetry, and Command Center.</desc>
  <rect width="920" height="560" fill="#0f1419"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6ea8fe"/>
    </marker>
  </defs>
  
  <text x="32" y="36" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="600">MyVista LLM Fabric</text>
  <text x="32" y="56" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12">Architecture — serving-path IntentOS routing is OFF. Context compiler is not on the serving path.</text>
  <rect x="40" y="80" width="160" height="56" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="52" y="102" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Developer / SDK</text>
  <text x="52" y="120" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">Python myvista</text>
  <text x="52" y="135" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">curl / OpenAI-shaped</text>
  <line x1="200" y1="108" x2="248" y2="108" stroke="#6ea8fe" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="250" y="80" width="170" height="56" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="262" y="102" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">MyVista Gateway</text>
  <text x="262" y="120" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">auth · quotas · /v1/chat</text>
  <text x="262" y="135" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">Command Center</text>
  <line x1="420" y1="108" x2="468" y2="108" stroke="#6ea8fe" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="470" y="72" width="200" height="72" rx="8" fill="#1a222c" stroke="#e6b84d"/>
  <text x="482" y="94" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">IntentOS</text>
  <text x="482" y="112" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">classify API exists</text>
  <text x="482" y="127" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">serving-path routing OFF</text>
  <rect x="584" y="80" width="74" height="16" rx="8" fill="none" stroke="#e6b84d"/><text x="621" y="92" text-anchor="middle" fill="#e6b84d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9">experimental</text>
  <line x1="570" y1="144" x2="570" y2="176" stroke="#6ea8fe" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="470" y="178" width="200" height="64" rx="8" fill="#1a222c" stroke="#2a3542" stroke-dasharray="5 4"/>
  <text x="482" y="200" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Context compiler</text>
  <text x="482" y="218" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">not on serving path</text>
  <rect x="584" y="186" width="74" height="16" rx="8" fill="none" stroke="#8b9aab"/><text x="621" y="198" text-anchor="middle" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9">not built</text>
  <line x1="570" y1="242" x2="570" y2="274" stroke="#6ea8fe" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="430" y="276" width="280" height="72" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="442" y="298" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Route planner</text>
  <text x="442" y="316" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">policy · health · fallback graph</text>
  <text x="442" y="331" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">Grade00–Grade29 declared classes</text>
  <rect x="624" y="284" width="74" height="16" rx="8" fill="none" stroke="#8b9aab"/><text x="661" y="296" text-anchor="middle" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9">built</text>
  <line x1="570" y1="348" x2="570" y2="380" stroke="#6ea8fe" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="250" y="382" width="640" height="52" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="262" y="404" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Inference fabric</text>
  <text x="262" y="422" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">Adapters: mock, OpenAI, Anthropic, Ollama, vLLM, generic OpenAI-compatible. LiteLLM is not a native adapter.</text>
  <rect x="250" y="444" width="145" height="52" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="262" y="466" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Ollama</text>
  <text x="262" y="484" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">local / Compose</text>
  <rect x="405" y="444" width="155" height="52" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="417" y="466" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">OpenAI-compat</text>
  <text x="417" y="484" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">vLLM · custom URLs</text>
  <rect x="570" y="444" width="145" height="52" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="582" y="466" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">OpenAI</text>
  <text x="582" y="484" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">hosted API</text>
  <rect x="725" y="444" width="165" height="52" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="737" y="466" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Anthropic</text>
  <text x="737" y="484" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">hosted API</text>
  <rect x="40" y="180" width="190" height="316" rx="8" fill="#1a222c" stroke="#6ea8fe"/>
  <text x="52" y="202" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Parallel systems</text>
  <text x="52" y="220" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">Guardrails  INPUT+OUTPUT wired</text>
  <text x="52" y="235" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">Usage metering  durable ledger</text>
  <text x="52" y="250" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">Evaluations  first-class gates</text>
  <text x="52" y="265" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">OpenTelemetry  traces/metrics</text>
  <text x="52" y="280" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">Command Center  live views</text>
  <text x="40" y="538" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10">Retrieval / context / execution guardrails are pluggable types. RAG, tools, and KV-cache views are not on the serving path.</text>

</svg>
