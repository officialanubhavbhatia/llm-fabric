<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">MyVista observability pipeline</title>
  <desc id="desc">Request flow through gateway, IntentOS, routing, provider, usage, guardrails, and OpenTelemetry traces, metrics, and logs into Command Center.</desc>
  <rect width="960" height="500" fill="#0f1419"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6ea8fe"/>
    </marker>
  </defs>
  
  <text x="32" y="36" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="600">Observability pipeline</text>
  <text x="32" y="56" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12">Built spans: request, auth, input_guardrails, intent, context, route, litellm, llm, output_guardrails, usage. Unbuilt: retrieval, tool, eval.</text>
  <rect x="40" y="80" width="140" height="52" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="52" y="102" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">SDK request</text>
  <line x1="180" y1="106" x2="220" y2="106" stroke="#6ea8fe" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="222" y="80" width="140" height="52" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="234" y="102" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Gateway trace</text>
  <line x1="362" y1="106" x2="402" y2="106" stroke="#6ea8fe" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="404" y="80" width="140" height="52" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="416" y="102" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">IntentOS span</text>
  <line x1="544" y1="106" x2="584" y2="106" stroke="#6ea8fe" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="586" y="80" width="140" height="52" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="598" y="102" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Context span</text>
  <line x1="726" y1="106" x2="766" y2="106" stroke="#6ea8fe" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="768" y="80" width="160" height="52" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="780" y="102" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Route + provider</text>
  <line x1="500" y1="132" x2="500" y2="168" stroke="#6ea8fe" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="40" y="170" width="200" height="64" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="52" y="192" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Usage event</text>
  <text x="52" y="210" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">invocation ledger row</text>
  <rect x="260" y="170" width="220" height="64" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="272" y="192" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Guardrail evaluation</text>
  <text x="272" y="210" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">input + output on chat</text>
  <rect x="500" y="170" width="200" height="64" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="512" y="192" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">OpenTelemetry</text>
  <text x="512" y="210" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">OTLP HTTP exporter</text>
  <line x1="600" y1="234" x2="600" y2="270" stroke="#6ea8fe" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="40" y="272" width="200" height="70" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="52" y="294" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Traces</text>
  <text x="52" y="312" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">trace_id · request_id</text>
  <rect x="260" y="272" width="200" height="70" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="272" y="294" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Metrics</text>
  <text x="272" y="312" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">bounded Prometheus labels</text>
  <rect x="480" y="272" width="200" height="70" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="492" y="294" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Logs</text>
  <text x="492" y="312" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">structured request logs</text>
  <line x1="600" y1="342" x2="600" y2="378" stroke="#6ea8fe" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="220" y="380" width="520" height="70" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="232" y="402" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Command Center / shared telemetry backend</text>
  <text x="232" y="420" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">local journal is per-process; fleet history belongs in the OTLP backend</text>
  <text x="40" y="480" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">Attributes when present: tenant, intent, route, provider, tokens, latency, cost. Secrets and raw private prompts are not stored by default.</text>

</svg>
