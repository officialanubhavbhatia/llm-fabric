<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
  <title id="title">MyVista routing and fallback graph</title>
  <desc id="desc">Inputs to the route planner and the primary-then-fallback path. IntentResult is required on chat; intent-aware serving-path routing remains off.</desc>
  <rect width="1000" height="480" fill="#0f1419"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6ea8fe"/>
    </marker>
  </defs>
  
  <text x="32" y="36" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="600">Intelligent routing</text>
  <text x="32" y="56" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12">Policy-based planner with health, circuit breakers, and a fallback graph. Grade00–Grade29 are declared classes, not 30 production-ranked models.</text>
  <rect x="32" y="80" width="150" height="64" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="44" y="102" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">IntentOS</text>
  <text x="44" y="120" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">required on chat</text>
  <text x="44" y="135" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">routing still OFF</text>
  <rect x="96" y="88" width="74" height="16" rx="8" fill="none" stroke="#7fd99a"/><text x="133" y="100" text-anchor="middle" fill="#7fd99a" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9">coverage</text>
  <rect x="194" y="80" width="150" height="64" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="206" y="102" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Capabilities</text>
  <text x="206" y="120" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">registry vectors</text>
  <rect x="356" y="80" width="150" height="64" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="368" y="102" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Tenant policy</text>
  <text x="368" y="120" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">quotas · allowlists</text>
  <rect x="518" y="80" width="150" height="64" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="530" y="102" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Latency SLO</text>
  <text x="530" y="120" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">optional preview</text>
  <rect x="680" y="80" width="150" height="64" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="692" y="102" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Cost policy</text>
  <text x="692" y="120" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">seven policies</text>
  <rect x="842" y="80" width="140" height="64" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="854" y="102" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Provider health</text>
  <text x="854" y="120" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">circuit breakers</text>
  <line x1="512" y1="144" x2="512" y2="176" stroke="#6ea8fe" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="360" y="178" width="300" height="70" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="372" y="200" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Route planner</text>
  <text x="372" y="218" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">auditable decision · POST /v1/routes/preview</text>
  <line x1="512" y1="248" x2="512" y2="280" stroke="#6ea8fe" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="360" y="282" width="300" height="64" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="372" y="304" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Primary model</text>
  <text x="372" y="322" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">selected deployment</text>
  <line x1="512" y1="346" x2="512" y2="378" stroke="#6ea8fe" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="360" y="380" width="300" height="70" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="372" y="402" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Fallback graph</text>
  <text x="372" y="420" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">health-aware failover</text>
  <text x="372" y="435" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">each attempt is a usage invocation</text>
  <rect x="32" y="178" width="300" height="272" rx="8" fill="#1a222c" stroke="#e6b84d"/>
  <text x="44" y="200" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Honest limits</text>
  <text x="44" y="218" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">Intent-aware serving-path routing: OFF</text>
  <text x="44" y="233" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">Model-grade IntentOS planner: planned</text>
  <text x="44" y="248" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">Context compiler: on the serving path</text>
  <text x="44" y="263" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">Quality cells are declared/measured/unknown</text>
  <text x="44" y="278" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">LiteLLM is transport, not an engine</text>

</svg>
