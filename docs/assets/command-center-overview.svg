<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">Command Center observability model</title>
  <desc id="desc">Schematic of Command Center metrics that exist: requests, latency, tokens, cost, failovers, plus views that are live versus not built.</desc>
  <rect width="960" height="460" fill="#0f1419"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6ea8fe"/>
    </marker>
  </defs>
  
  <text x="32" y="36" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="600">Command Center overview</text>
  <text x="32" y="56" fill="#e6b84d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12">Observability model — schematic, not a live screenshot. Metrics named here exist in this build unless marked unavailable.</text>
  <rect x="32" y="78" width="140" height="70" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="44" y="100" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Requests/sec</text>
  <text x="44" y="118" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">process buffer rps</text>
  <text x="44" y="133" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">not a fleet SLA</text>
  <rect x="184" y="78" width="140" height="70" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="196" y="100" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Latency</text>
  <text x="196" y="118" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">p50 / p95 / p99 ms</text>
  <text x="196" y="133" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">from usage records</text>
  <rect x="336" y="78" width="140" height="70" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="348" y="100" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Prompt tokens</text>
  <text x="348" y="118" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">ledger + provenance</text>
  <rect x="488" y="78" width="140" height="70" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="500" y="100" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Completion tokens</text>
  <text x="500" y="118" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">ledger + provenance</text>
  <rect x="640" y="78" width="140" height="70" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="652" y="100" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Cost</text>
  <text x="652" y="118" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">registry price × tokens</text>
  <text x="652" y="133" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">estimated vs measured</text>
  <rect x="792" y="78" width="140" height="70" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="804" y="100" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Failovers</text>
  <text x="804" y="118" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">fallback attempts</text>
  <rect x="32" y="168" width="280" height="150" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="44" y="190" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Live views</text>
  <text x="44" y="208" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">overview · users · tenants</text>
  <text x="44" y="223" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">requests · traces · intents</text>
  <text x="44" y="238" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">models · promotion · tiers</text>
  <text x="44" y="253" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">routing · fallbacks · tokens</text>
  <text x="44" y="268" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">economics · evals · drift</text>
  <text x="44" y="283" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">reliability</text>
  <rect x="328" y="168" width="280" height="150" rx="8" fill="#1a222c" stroke="#2a3542" stroke-dasharray="5 4"/>
  <text x="340" y="190" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Unavailable views</text>
  <text x="340" y="208" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">threads — no conversation persist</text>
  <text x="340" y="223" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">kv_cache — not scraped</text>
  <text x="340" y="238" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">batching — not scraped</text>
  <text x="340" y="253" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">context — compiler not on path</text>
  <rect x="522" y="176" width="74" height="16" rx="8" fill="none" stroke="#8b9aab"/><text x="559" y="188" text-anchor="middle" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9">not built</text>
  <rect x="624" y="168" width="308" height="150" rx="8" fill="#1a222c" stroke="#2a3542" stroke-dasharray="5 4"/>
  <text x="636" y="190" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Not sourced in this build</text>
  <text x="636" y="208" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">quality / safety scores</text>
  <text x="636" y="223" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">tokens per second (TPS)</text>
  <text x="636" y="238" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">queue depth as a fleet queue</text>
  <text x="636" y="253" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">GPU hours / electricity</text>
  <rect x="32" y="338" width="280" height="100" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="44" y="360" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Route decision</text>
  <text x="44" y="378" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">selected model · provider</text>
  <text x="44" y="393" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">policy · fallback graph</text>
  <rect x="328" y="338" width="280" height="100" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="340" y="360" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">IntentOS (frozen eval)</text>
  <text x="340" y="378" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">serving-path routing OFF</text>
  <text x="340" y="393" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">HN gate not cleared</text>
  <rect x="624" y="338" width="308" height="100" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="636" y="360" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Dependency health</text>
  <text x="636" y="378" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">Postgres / Redis</text>
  <text x="636" y="393" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">/healthz vs /readyz</text>

</svg>
