<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Command Center observability model</title>
  <desc id="desc">Schematic of Command Center coverage, request, reliability, latency, token, and cost cards, plus live versus unbuilt views.</desc>
  <rect width="960" height="430" fill="#0f1419"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6ea8fe"/>
    </marker>
  </defs>
  
  <text x="32" y="36" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="600">Command Center overview</text>
  <text x="32" y="56" fill="#e6b84d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12">Observability model — schematic, not a live screenshot. Coverage cards are attachment metrics, not accuracy.</text>
  <rect x="32" y="78" width="180" height="70" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="44" y="100" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Intent serving</text>
  <text x="44" y="118" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">IntentResult coverage</text>
  <text x="44" y="133" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">not classification accuracy</text>
  <rect x="224" y="78" width="180" height="70" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="236" y="100" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Context records</text>
  <text x="236" y="118" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">compiler coverage</text>
  <rect x="416" y="78" width="180" height="70" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="428" y="100" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Provenance</text>
  <text x="428" y="118" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">supported metrics labelled</text>
  <rect x="608" y="78" width="160" height="70" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="620" y="100" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Requests</text>
  <text x="620" y="118" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">process buffer</text>
  <rect x="780" y="78" width="160" height="70" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="792" y="100" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Reliability</text>
  <text x="792" y="118" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">error rate in buffer</text>
  <rect x="32" y="164" width="160" height="70" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="44" y="186" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Latency</text>
  <text x="44" y="204" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">p50 / p95 / p99 ms</text>
  <rect x="204" y="164" width="160" height="70" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="216" y="186" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Token volume</text>
  <text x="216" y="204" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">ledger + provenance</text>
  <rect x="376" y="164" width="160" height="70" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="388" y="186" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Cost</text>
  <text x="388" y="204" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">estimated vs measured</text>
  <rect x="548" y="164" width="392" height="70" rx="8" fill="#1a222c" stroke="#2a3542" stroke-dasharray="5 4"/>
  <text x="560" y="186" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Not sourced</text>
  <text x="560" y="204" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">quality · safety · TPS as a single number · fleet queue depth</text>
  <rect x="32" y="250" width="300" height="150" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="44" y="272" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Live views</text>
  <text x="44" y="290" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">overview · users · tenants</text>
  <text x="44" y="305" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">requests · traces · intents</text>
  <text x="44" y="320" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">models · promotion · tiers</text>
  <text x="44" y="335" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">routing · fallbacks · tokens</text>
  <text x="44" y="350" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">context · kv_cache</text>
  <text x="44" y="365" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">economics · evals · drift</text>
  <text x="44" y="380" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">reliability</text>
  <rect x="348" y="250" width="300" height="150" rx="8" fill="#1a222c" stroke="#2a3542" stroke-dasharray="5 4"/>
  <text x="360" y="272" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Unavailable views</text>
  <text x="360" y="290" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">threads — no conversation persist</text>
  <text x="360" y="305" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">batching — no stable vLLM series</text>
  <rect x="562" y="258" width="74" height="16" rx="8" fill="none" stroke="#8b9aab"/><text x="599" y="270" text-anchor="middle" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9">not built</text>
  <rect x="664" y="250" width="276" height="150" rx="8" fill="#1a222c" stroke="#e6b84d"/>
  <text x="676" y="272" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">KV / engine</text>
  <text x="676" y="290" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">vLLM scrape when configured</text>
  <text x="676" y="305" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">Ollama KV: UNAVAILABLE</text>
  <text x="676" y="320" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">DEPLOYMENT scope, not request</text>

</svg>
