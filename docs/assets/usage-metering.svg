<svg xmlns="http://www.w3.org/2000/svg" width="990" height="500" viewBox="0 0 990 500" role="img" aria-labelledby="title desc">
  <title id="title">MyVista usage metering architecture</title>
  <desc id="desc">Provider invocations become UsageEvents stored in PostgreSQL with Redis fast counters, shown in Command Center. Not billing-grade exactly-once accounting.</desc>
  <rect width="990" height="500" fill="#0f1419"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6ea8fe"/>
    </marker>
  </defs>
  
  <text x="32" y="36" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="600">Usage metering</text>
  <text x="32" y="56" fill="#e6b84d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12">Durable usage accounting — not billing-grade exactly-once accounting. Crash windows are classified, not hidden.</text>
  <rect x="40" y="80" width="180" height="60" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="52" y="102" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Provider invocation</text>
  <line x1="220" y1="110" x2="268" y2="110" stroke="#6ea8fe" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="270" y="80" width="180" height="60" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="282" y="102" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">UsageEvent</text>
  <line x1="450" y1="110" x2="498" y2="110" stroke="#6ea8fe" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="500" y="80" width="220" height="60" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="512" y="102" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">PostgreSQL usage_events</text>
  <line x1="720" y1="110" x2="768" y2="110" stroke="#6ea8fe" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="770" y="80" width="180" height="60" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="782" y="102" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Redis counters</text>
  <text x="782" y="120" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">best-effort INCR</text>
  <line x1="610" y1="140" x2="610" y2="176" stroke="#6ea8fe" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="430" y="178" width="360" height="64" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="442" y="200" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Command Center / Economics</text>
  <text x="442" y="218" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">registry prices × tokens</text>
  <rect x="40" y="178" width="360" height="200" rx="8" fill="#1a222c" stroke="#2a3542"/>
  <text x="52" y="200" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">What is counted</text>
  <text x="52" y="218" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">HTTP request</text>
  <text x="52" y="233" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">each provider invocation</text>
  <text x="52" y="248" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">fallback attempts</text>
  <text x="52" y="263" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">prompt + completion tokens</text>
  <text x="52" y="278" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">token provenance</text>
  <text x="52" y="293" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">estimated vs measured cost</text>
  <rect x="40" y="396" width="910" height="84" rx="8" fill="#1a222c" stroke="#e6b84d"/>
  <text x="52" y="418" fill="#e8eef4" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Crash window (not exactly-once)</text>
  <text x="52" y="436" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">Provider returns then process dies before INSERT → invocation lost.</text>
  <text x="52" y="451" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">INSERT succeeds then client retries → a new invocation_id; a second real provider call is counted.</text>
  <text x="52" y="466" fill="#8b9aab" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11">INSERT succeeds and Redis INCR fails → ledger is ahead; reconcile repairs Redis from Postgres, never the reverse.</text>

</svg>
