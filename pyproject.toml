[project]
name = "llm-fabric"
version = "0.1.0"
description = "MyVista LLM Fabric - LLM gateway, serving, and inferencing layers"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Anubhav Bhatia" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
llm-fabric = "llm_fabric.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_fabric"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Calling Depends/Query in an argument default is how FastAPI declares
# dependencies, so B008 does not apply to them.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Path",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
