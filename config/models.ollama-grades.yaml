# Local Ollama ladder: Grade00–Grade29 (public L0–L29; L30 aliases Grade29).
#
# Tags are official Ollama-library names. Default pulls are quantized GGUF
# (typically Q4_K_M). The fabric does not download weights; `ollama pull` is
# an operator step (make ollama-pull-grades / k8s-ollama-pull-grades).
#
# This is NOT a quality ranking. Families were chosen so coding (coder /
# starcoder / granite-code / codegemma), reasoning (deepseek-r1), and
# tool-calling instruct models can be declared as capabilities. Quality and
# performance scores are omitted because this checkout has not measured them.
# `lifecycle: approved` here is local-development attestation, the same
# pattern as config/models.local.yaml — not production promotion evidence.
#
# Thirty tags on disk are not thirty models in VRAM. Ollama loads on demand.
# Docker Desktop and kind cannot hold the 7B–9B class concurrently.

