name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded run tells you nothing useful, so in-flight runs for the same ref
# are cancelled. `main` is exempt: those runs are the release record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHON_VERSION: "3.12"
  # Fail-closed environment selection: every job that constructs Settings or
  # create_app must name a mode. `test` is the CI mode. Do not infer it.
  LLM_FABRIC_ENVIRONMENT: test

jobs:
  # Deliberately a separate job rather than a step inside `tests`. A cross-tenant
  # failure means one customer can read another's data, and it should be legible
  # as exactly that on the checks list, not buried in a general test log.
  tenant-isolation:
    name: Tenant isolation (cross-tenant leak gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fabric
          POSTGRES_PASSWORD: fabric
          POSTGRES_DB: fabric
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LLM_FABRIC_TEST_DATABASE_URL: postgresql://fabric:fabric@localhost:5432/fabric
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install
        run: uv sync --extra dev

      - name: Run the adversarial isolation suite
        # `-m isolation` exits 5 when nothing is collected, so deleting or
        # renaming the marker fails the gate instead of silently passing it.
        run: uv run pytest -m isolation -v --strict-markers

  # Also its own job, for a different reason: this one is a *regression* gate.
  # Floors sit below the IntentOS v1 measured run in INTENTOS_EVALUATION.md so
  # the job fails when the classifier gets worse, not when it fails to get
  # better. Raise a floor only after a measured run justifies it.
  intent-benchmark:
    name: Intent benchmark (classifier regression gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install
        run: uv sync --extra dev

      # Offline: no --provider, so L4/L5 never run and no credentials are needed.
      - name: Classifier metrics
        run: >
          uv run llm-fabric-bench
          --show-failures
          --min-accuracy 0.85
          --min-macro-f1 0.88
          --min-unknown-recall 0.80
          --min-high-confidence-precision 0.90

      # A false hit is a prompt answered with a different prompt's intent, so the
      # ceiling is deliberately near zero rather than merely "low". The
      # similarity threshold is pinned to the value docs/EVALUATIONS.md was
      # measured at: at the stricter default the cache serves no semantic hits at
      # all on this dataset, which leaves the rate unmeasured, and the CLI fails
      # an unmeasured gate rather than passing it by default.
      - name: Cache false-hit rate
        run: >
          uv run llm-fabric-bench
          --mode cache
          --semantic-similarity 0.60
          --max-semantic-false-hit-rate 0.05

  quality:
    name: Lint, format and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy src

  tests:
    name: Test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fabric
          POSTGRES_PASSWORD: fabric
          POSTGRES_DB: fabric
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LLM_FABRIC_TEST_DATABASE_URL: postgresql://fabric:fabric@localhost:5432/fabric
      LLM_FABRIC_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install
        run: uv sync --extra dev

      - name: Run every test
        run: uv run pytest -v --strict-markers

  typescript-sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Typecheck and unit tests
        working-directory: sdk/typescript
        run: npm test

  security:
    name: Security and isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fabric
          POSTGRES_PASSWORD: fabric
          POSTGRES_DB: fabric
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LLM_FABRIC_ENVIRONMENT: test
      LLM_FABRIC_TEST_DATABASE_URL: postgresql://fabric:fabric@localhost:5432/fabric
      LLM_FABRIC_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      - name: Install
        run: uv sync --extra dev
      - name: Security tests
        run: uv run pytest tests/security -v --strict-markers

  build:
    name: Production image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build gateway image
        run: >
          docker build
          --build-arg VERSION=ci
          --build-arg REVISION=${{ github.sha }}
          -f deployments/docker/Dockerfile
          -t llm-fabric:ci .
      - name: Verify non-root read-only runtime and packaged Command Center
        run: |
          docker run --detach --rm --name llm-fabric-ci \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL --security-opt no-new-privileges \
            --publish 47317:47317 \
            --volume "$PWD/config:/app/config:ro" \
            --env LLM_FABRIC_ENVIRONMENT=development \
            --env LLM_FABRIC_HOST=0.0.0.0 \
            --env LLM_FABRIC_ALLOW_ANONYMOUS=true \
            --env LLM_FABRIC_REGISTRY_PATH=/app/config/models.yaml \
            --env LLM_FABRIC_ROUTING_CONFIG_PATH=/app/config/routing.yaml \
            --env LLM_FABRIC_PROMOTION_CONFIG_PATH=/app/config/promotion.yaml \
            llm-fabric:ci
          trap 'docker stop --time 30 llm-fabric-ci || true' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:47317/healthz && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:47317/readyz
          curl --fail --silent http://127.0.0.1:47317/command-center >/dev/null
          curl --fail --silent -H 'content-type: application/json' \
            -d '{"model":"auto","messages":[{"role":"user","content":"image smoke"}]}' \
            http://127.0.0.1:47317/v1/chat/completions >/dev/null
          test "$(docker image inspect llm-fabric:ci --format '{{.Config.User}}')" = "10001:10001"
      - name: Generate image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: llm-fabric:ci
          format: spdx-json
          output-file: llm-fabric.spdx.json
      # Monitor-only until a reviewed vulnerability baseline defines blocking
      # exceptions. Findings remain visible without moving a gate post-hoc.
      - name: Scan image vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: llm-fabric:ci
          format: table
          exit-code: "0"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Record image digest
        run: docker image inspect llm-fabric:ci --format 'digest={{.Id}}'

  helm:
    name: Helm portability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.15.3
      - name: Lint and render default/local/cloud examples
        run: make helm-check

  kind:
    name: kind image and chart smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.15.3
      - uses: helm/kind-action@v1.10.0
        with:
          install_only: true
          version: v0.23.0
      - name: Build, load, and install the same image
        run: make k8s-local-up
      - name: Health, mock chat, headers, and rolling restart
        run: make k8s-local-test
      - name: Delete kind cluster
        if: always()
        run: make k8s-local-down

  # Regression gate for the evaluation platform. The committed baseline is a
  # measured run of datasets/eval/ci-suite.yaml. A material drop on a critical
  # metric fails the job; an unmeasured critical metric also fails.
  eval-gates:
    name: Evaluation gates (baseline vs candidate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install
        run: uv sync --extra dev

      - name: Enforce evaluation gates
        env:
          LLM_FABRIC_ENVIRONMENT: test
        run: >
          uv run llm-fabric-eval gate
          --suite datasets/eval/ci-suite.yaml
          --baseline datasets/eval/baseline.json
