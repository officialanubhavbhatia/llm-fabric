nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: llm-fabric
  tag: "0.1.0"
  # Production values should pin sha256:<digest>; digest takes precedence over tag.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 47317
  nodePort: null
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: llm-fabric.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Starter examples, not measured production recommendations.
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

probes:
  readiness:
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  liveness:
    path: /healthz
    initialDelaySeconds: 10
    periodSeconds: 20
    timeoutSeconds: 2
    failureThreshold: 3
  startup:
    path: /healthz
    failureThreshold: 30
    periodSeconds: 2
    timeoutSeconds: 2

autoscaling:
  # Disabled until metrics-server is installed and resource requests are measured.
  # YAML alone is not verified autoscaling.
  enabled: false
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: null

podDisruptionBudget:
  # Disabled by default so a one-replica release cannot block node maintenance.
  enabled: false
  minAvailable: 1
  maxUnavailable: null

# Existing serving configuration uses a 25-second bounded graceful-shutdown
# window; Kubernetes gets five additional seconds before SIGKILL.
terminationGracePeriodSeconds: 30

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

config:
  # Portable defaults provide a mock-only install. Production values must set
  # production auth and distributed-state credentials through secretName.
  environment: development
  host: 0.0.0.0
  port: 47317
  allowAnonymous: "true"
  authMode: disabled
  extraEnv: []

providers:
  # Rendered to LLM_FABRIC_PROVIDER_BASE_URLS as JSON. Endpoints are trusted
  # operator configuration, never accepted from public requests.
  baseUrls: {}

# Optional existing Secret projected as environment variables. This chart does
# not create credentials. External Secrets / CSI drivers may own this object.
secretName: ""

fabricConfig:
  models: |
    models:
      - id: mock-small
        provider: mock
        provider_model: mock-small
        grade: Grade02
        context_window: 8192
        capabilities: [chat, streaming]
        placement:
          locality: local
        enabled: true
        lifecycle: approved
    aliases:
      - id: auto
        policy: cost_first
        candidates: [mock-small]
  routing: |
    routing:
      version: portable-default-v1
      default_policy: cost_first
  promotion: |
    promotion:
      version: portable-default-v1
      auto_requires_approved:
        production: true
      pin_requires_approved:
        production: true
      bind_identity: true
      require_probe: true
      require_evaluation: true
      require_shadow_artifact: true

# Production promotion state and referenced JSON evidence must be identical
# across replicas. Point this at an operator-managed immutable ConfigMap whose
# keys are mounted under /app/datasets/eval/models.
promotionEvidence:
  existingConfigMap: ""
  stateKey: promotion-state.json

# Pre-install/pre-upgrade migration Job. Enable only when external PostgreSQL is
# configured. The Secret must provide LLM_FABRIC_MIGRATION_DATABASE_URL.
migrations:
  enabled: false
  backoffLimit: 6

# Shared traces: set otlp.endpoint to an OTLP HTTP traces URL
# (http://otel-collector:4318/v1/traces). Auth headers belong in the Secret as
# LLM_FABRIC_OTEL_EXPORTER_OTLP_HEADERS, never in this ConfigMap.
# Collector outage is fail-soft; readiness stays up.
observability:
  otlp:
    endpoint: ""
  prometheus:
    serviceAnnotations: {}

affinity: {}
topologySpreadConstraints: []
nodeSelector: {}
tolerations: []

networkPolicy:
  # Provider destinations are deployment-specific, so no default-deny egress
  # policy is enabled by the portable chart.
  enabled: false
  ingressNamespaceSelector: {}
  egress: []

# Local-only external inference workload. Disabled for all production examples.
ollama:
  enabled: false
  image:
    repository: ollama/ollama
    tag: "0.32.15"
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
  resources: {}
  nodeSelector: {}
  tolerations: []
