# Manifest-validated example only; not live-tested on EKS.
replicaCount: 3

image:
  repository: 123456789012.dkr.ecr.us-east-1.amazonaws.com/llm-fabric
  tag: "0c42672"
  digest: "" # Set the published sha256 digest for production.
  pullPolicy: IfNotPresent

config:
  environment: production
  allowAnonymous: "false"
  authMode: oidc
  intentClassificationEnabled: "true"
  intentEmbedder: hashing
  intentAllowHashingEmbedder: "true"

secretName: llm-fabric
migrations:
  enabled: true

serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/llm-fabric

providers:
  baseUrls:
    vllm-general: http://vllm-general.inference.svc.cluster.local:8000/v1

podDisruptionBudget:
  enabled: true
  minAvailable: 2

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: llm-fabric

ingress:
  enabled: false
  className: alb
  annotations:
    alb.ingress.kubernetes.io/target-type: ip
