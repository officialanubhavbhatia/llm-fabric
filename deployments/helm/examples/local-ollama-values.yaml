replicaCount: 1

image:
  repository: llm-fabric
  tag: dev
  digest: ""
  pullPolicy: IfNotPresent

config:
  environment: development
  allowAnonymous: "true"
  authMode: disabled

secretName: ""
migrations:
  enabled: false

service:
  type: NodePort
  nodePort: 30017

providers:
  baseUrls:
    ollama-local: http://llm-fabric-ollama:11434/v1

fabricConfig:
  models: |
    models:
      - id: ollama-local
        provider: ollama-local
        provider_model: llama3.2
        grade: Grade08
        context_window: 8192
        capabilities: [chat, streaming]
        placement:
          locality: local
        enabled: true
        lifecycle: approved
      - id: mock-small
        provider: mock
        provider_model: mock-small
        grade: Grade02
        context_window: 8192
        capabilities: [chat, streaming]
        placement:
          locality: local
        enabled: true
        lifecycle: approved
    aliases:
      - id: auto
        policy: declared
        candidates: [ollama-local, mock-small]

ollama:
  enabled: true
  persistence:
    enabled: false
