# Overlay for Docker Desktop: Postgres, Redis, and observability wired into
# whichever Fabric gateway profile is active. Do not combine --profile mock
# and --profile local; both gateways bind host port 47317.

services:
  gateway-mock:
    environment:
      LLM_FABRIC_DATABASE_URL: postgresql://fabric_app:fabric@postgres:5432/fabric
      LLM_FABRIC_REDIS_URL: redis://redis:6379/0
      LLM_FABRIC_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started

  gateway-ollama:
    environment:
      LLM_FABRIC_DATABASE_URL: postgresql://fabric_app:fabric@postgres:5432/fabric
      LLM_FABRIC_REDIS_URL: redis://redis:6379/0
      LLM_FABRIC_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
      ollama:
        condition: service_healthy

  grafana:
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
