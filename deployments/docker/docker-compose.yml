# Local release bundle. Each process remains an independently managed workload.
# Profiles:
#   mock            Fabric with deterministic in-process inference
#   local           Fabric plus Ollama (weights persist outside the Fabric image)
#   observability   OTLP collector, Prometheus, and Grafana
#   platform        PostgreSQL and Redis for production-state integration tests

services:
  postgres:
    image: postgres:16.4
    profiles: ["platform"]
    environment:
      POSTGRES_USER: fabric
      POSTGRES_PASSWORD: fabric
      POSTGRES_DB: fabric
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fabric"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4
    profiles: ["platform"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    profiles: ["observability"]
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4318:4318"

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["observability"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["observability"]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"

  ollama:
    image: ollama/ollama:0.32.15
    profiles: ["local"]
    ports:
      - "11434:11434"
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama-pull:
    image: ollama/ollama:0.32.15
    profiles: ["tools"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull"]
    volumes:
      - ollama-models:/root/.ollama

  gateway-mock:
    profiles: ["mock"]
    image: ${LLM_FABRIC_IMAGE:-llm-fabric:dev}
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
      args:
        VERSION: ${LLM_FABRIC_VERSION:-0.1.0}
        REVISION: ${LLM_FABRIC_REVISION:-dev}
    environment:
      LLM_FABRIC_ENVIRONMENT: development
      LLM_FABRIC_HOST: 0.0.0.0
      LLM_FABRIC_PORT: 47317
      LLM_FABRIC_ALLOW_ANONYMOUS: "true"
      LLM_FABRIC_REGISTRY_PATH: /app/config/models.yaml
      LLM_FABRIC_ROUTING_CONFIG_PATH: /app/config/routing.yaml
      LLM_FABRIC_PROMOTION_CONFIG_PATH: /app/config/promotion.yaml
      LLM_FABRIC_PROMOTION_STATE_PATH: /tmp/promotion-state.json
    volumes:
      - ../../config:/app/config:ro
    ports:
      - "47317:47317"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  gateway-ollama:
    profiles: ["local"]
    image: ${LLM_FABRIC_IMAGE:-llm-fabric:dev}
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
      args:
        VERSION: ${LLM_FABRIC_VERSION:-0.1.0}
        REVISION: ${LLM_FABRIC_REVISION:-dev}
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      LLM_FABRIC_ENVIRONMENT: development
      LLM_FABRIC_HOST: 0.0.0.0
      LLM_FABRIC_PORT: 47317
      LLM_FABRIC_ALLOW_ANONYMOUS: "true"
      LLM_FABRIC_REGISTRY_PATH: ${LLM_FABRIC_COMPOSE_REGISTRY:-/app/config/models.local.yaml}
      LLM_FABRIC_ROUTING_CONFIG_PATH: /app/config/routing.yaml
      LLM_FABRIC_PROMOTION_CONFIG_PATH: /app/config/promotion.yaml
      LLM_FABRIC_PROMOTION_STATE_PATH: /tmp/promotion-state.json
      LLM_FABRIC_OLLAMA_BASE_URL: http://ollama:11434/v1
      LLM_FABRIC_REQUEST_TIMEOUT_S: "300"
    volumes:
      - ../../config:/app/config:ro
    ports:
      - "47317:47317"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  migrate:
    profiles: ["platform"]
    image: ${LLM_FABRIC_IMAGE:-llm-fabric:dev}
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    working_dir: /app
    command: ["python", "-m", "alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LLM_FABRIC_MIGRATION_DATABASE_URL: postgresql://fabric:fabric@postgres:5432/fabric

volumes:
  ollama-models:
