# Example values overlay: LLM Fabric in front of external vLLM pools.
#
# LLM Fabric and vLLM remain separate deployable components. This file does
# not install a GPU operator or a vLLM chart. Apply on top of
# deployments/helm/llm-fabric:
#
#   helm upgrade --install llm-fabric deployments/helm/llm-fabric \
#     -f examples/helm/vllm-pools-values.yaml \
#     --set image.digest=sha256:<digest>
#
# Put API keys and OIDC secrets in the Secret named by secretName, never here.
# Provider URLs below are cluster-local examples, not measured endpoints.
# A reachable vLLM Service does not approve a model.

replicaCount: 2

image:
  repository: llm-fabric
  tag: "0.1.0"
  digest: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 47317

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

probes:
  readiness:
    path: /readyz
  liveness:
    path: /healthz
  startup:
    path: /healthz

config:
  environment: production
  host: 0.0.0.0
  port: 47317
  allowAnonymous: "false"
  authMode: oidc

secretName: llm-fabric
migrations:
  enabled: true

providers:
  baseUrls:
    vllm-general: http://vllm-general:8000/v1
    vllm-coding: http://vllm-coding:8000/v1
    vllm-reasoning: http://vllm-reasoning:8000/v1
    vllm-long-context: http://vllm-long-context:8000/v1

observability:
  otlp:
    endpoint: "http://otel-collector:4318/v1/traces"
